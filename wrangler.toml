
name = "champion-celebration-api"
main = "worker/index.ts"
compatibility_date = "2026-10-19"

[[d1_databases]]
binding = "DB"
database_name = "champion-celebration-db"
database_id = "f270a070-0d1c-4e96-85b9-4c60847bb2fd"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
# ...
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

[observability.issue_detection]
enabled = false
# ...
